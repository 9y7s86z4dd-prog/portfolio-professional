name: Optimize portfolio images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Futuristic VIB Skyline Emblem.png"
      - "Vicky Ibnu Bayanka_202121017.jpg"
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

concurrency:
  group: optimize-portfolio-images
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image converter
        run: python -m pip install --upgrade Pillow

      - name: Convert original images to WebP
        run: |
          mkdir -p assets
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          conversions = [
              (Path("Futuristic VIB Skyline Emblem.png"), Path("assets/vib-logo.webp"), 86),
              (Path("Vicky Ibnu Bayanka_202121017.jpg"), Path("assets/profile.webp"), 84),
          ]

          for source, destination, quality in conversions:
              if not source.is_file():
                  raise FileNotFoundError(f"Source image not found: {source}")

              with Image.open(source) as original:
                  image = ImageOps.exif_transpose(original)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGBA" if "A" in image.getbands() else "RGB")
                  image.save(
                      destination,
                      "WEBP",
                      quality=quality,
                      method=6,
                      optimize=True,
                  )
                  print(
                      f"{source} -> {destination}: "
                      f"{source.stat().st_size:,} bytes -> {destination.stat().st_size:,} bytes"
                  )
          PY

      - name: Update website image references
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("index.html")
          html = page.read_text(encoding="utf-8")

          replacements = {
              "https://resonant-crisp-257f09.netlify.app/Futuristic%20VIB%20Skyline%20Emblem.png":
                  "https://resonant-crisp-257f09.netlify.app/assets/vib-logo.webp",
              "/Futuristic%20VIB%20Skyline%20Emblem.png":
                  "/assets/vib-logo.webp",
              "Futuristic%20VIB%20Skyline%20Emblem.png":
                  "assets/vib-logo.webp",
              "Vicky Ibnu Bayanka_202121017.jpg":
                  "assets/profile.webp",
          }

          for old, new in replacements.items():
              html = html.replace(old, new)

          page.write_text(html, encoding="utf-8")
          PY

      - name: Commit optimized images and website references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vib-logo.webp assets/profile.webp index.html
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimize portfolio images to WebP"
            git push
          fi
